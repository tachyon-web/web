# cargo-audit configuration.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack": non-constant-time RSA in the `rsa` crate.
    #
    # Reached only via `arti-client -> tor-key-forge -> ssh-key-fork-arti -> rsa`, so it is
    # present only in builds with the `tor` feature. Arti uses it to parse OpenSSH-format
    # key files on local disk, not for RSA operations against network-controlled input, and
    # the attack requires an attacker who can observe timing of RSA private-key operations
    # over the network. No patched version of `rsa` exists (the fix is a full rewrite to a
    # constant-time implementation, still in progress upstream).
    #
    # Drop this once `rsa` ships a constant-time release and Arti bumps to it.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0258 — `h2` unbounded empty DATA frames (memory exhaustion).
    #
    # Reached only via the `actix-web` and `rocket` comparison frameworks pulled in by the
    # `benches/*` workspace members (`actix-http -> h2`, `rocket -> hyper 0.14 -> h2`). The
    # tachyon-web library itself depends on `h2 0.4.18` (patched) directly; the vulnerable
    # `h2 0.3.27` never appears in a build of the published crate. No fixed release exists
    # yet from either actix-web (4.15.0) or rocket (0.5.1), both still pinned to h2 0.3.x.
    #
    # Drop this once actix-web or rocket bump their `h2` dependency to >=0.4.16.
    "RUSTSEC-2026-0258",

    # RUSTSEC-2024-0436 — `paste` is unmaintained (archived by its author).
    #
    # Informational only: no vulnerability, and it is a compile-time proc-macro that emits
    # no runtime code. Transitive, with no direct dependency on it from this crate.
    "RUSTSEC-2024-0436",

    # RUSTSEC-2025-0141 — `bincode` is unmaintained (development ceased).
    #
    # Informational only: no vulnerability. Transitive, and not on any path this crate
    # feeds attacker-controlled bytes into.
    "RUSTSEC-2025-0141",
]
