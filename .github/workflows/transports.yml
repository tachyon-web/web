name: Anonymity transports

on:
  push:
    branches: [main]
    paths:
      - 'src/server/tor.rs'
      - 'src/server/i2p.rs'
      - 'src/server/conn.rs'
      - 'src/anonymity.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/transports.yml'
  pull_request:
    paths:
      - 'src/server/tor.rs'
      - 'src/server/i2p.rs'
      - 'src/server/conn.rs'
      - 'src/anonymity.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/transports.yml'
  workflow_dispatch:

concurrency:
  group: transports-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  all-features:
    name: all features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: all-features
      - run: cargo clippy --locked -p tachyon-web --all-targets --all-features
      - run: cargo test --locked -p tachyon-web --all-features
