name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: fmt / clippy / msrv / parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: rustfmt
        run: cargo fmt --all --check
      - name: cargo-audit
        run: cargo audit
      - name: clippy (default features)
        run: cargo clippy --locked -p tachyon-web --all-targets
      - uses: dtolnay/rust-toolchain@1.92
      - name: msrv (1.92)
        run: cargo +1.92 check --locked -p tachyon-web --features tls,acme,http3

  build:
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
          - name: minimal (http1 only)
            flags: --no-default-features --features http1
          - name: http2 only (h2c, no HTTP/1.1 fallback)
            flags: --no-default-features --features http2
          - name: transports (tls, acme, http/3)
            flags: --features tls,acme,http3
          - name: tls12-legacy (opt-in TLS 1.2 fallback)
            flags: --features tls,acme,http3,tls12-legacy
          - name: fips
            flags: --features tls,http3,fips
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.name }}
      - name: clippy
        if: matrix.flags
        run: cargo clippy --locked -p tachyon-web --all-targets ${{ matrix.flags }}
      - name: test
        run: cargo test --locked -p tachyon-web ${{ matrix.flags }}

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - name: Install cmake (i2pd-sys builds its vendored C++ router)
        run: sudo apt-get update && sudo apt-get install -y cmake
      # The same feature list as `[package.metadata.docs.rs]`, so a docs.rs build failure shows
      # up here first. Keep the two in sync.
      - name: rustdoc (docs.rs features)
        run: cargo doc --locked -p tachyon-web --features http1,http2,tracing,tls,tls12-legacy,http3,acme,tor,i2p --no-deps
      - name: rustdoc (default features)
        run: cargo doc --locked -p tachyon-web --no-deps
      - name: doctests
        run: cargo test --locked -p tachyon-web --features http1,http2,tracing,tls,tls12-legacy,http3,acme,tor,i2p --doc

  cnsa:
    name: strict CNSA 2.0 profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install CMake (i2pd-sys builds its vendored C++ router)
        run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo clippy --locked -p tachyon-web --no-default-features --features http1,cnsa --all-targets
      - run: cargo test --locked -p tachyon-web --no-default-features --features http1,cnsa --lib
      # `cnsa` excludes `tor` and `i2p`, so they are checked here without it — with TLS and,
      # since no other job does, without. Both have broken the build before while every other
      # job stayed green.
      - run: cargo clippy --locked -p tachyon-web --all-targets --features tls,acme,http3,tor,i2p
      - run: cargo clippy --locked -p tachyon-web --all-targets --no-default-features --features http1,tor,i2p
      # Each anonymity transport on its own with TLS, where no other transport keeps shared
      # code alive.
      - run: cargo check --locked -p tachyon-web --features tls,tor
      - run: cargo check --locked -p tachyon-web --features tls,i2p
