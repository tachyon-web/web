name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: fmt / clippy / msrv / parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: rustfmt
        run: cargo fmt --all --check
      - name: cargo-audit
        run: cargo audit
      - name: clippy (default features)
        run: cargo clippy --locked -p tachyon-web --all-targets
      - name: axum parity
        run: cargo test --locked -p parity-tests
      - uses: dtolnay/rust-toolchain@1.92
      - name: msrv (1.92)
        run: cargo +1.92 check --locked -p tachyon-web --features ws,sse,tower,tls,cert-gen,lets-encrypt,http3,compression-full,early-hints

  build:
    name: "${{ matrix.name }}"
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default (linux)
            os: ubuntu-latest
          - name: default (macos)
            os: macos-latest
          - name: default (windows)
            os: windows-latest
          - name: minimal (http1 only)
            flags: --no-default-features --features http1
          - name: http2 only (h2c, no HTTP/1.1 fallback)
            flags: --no-default-features --features http2
          - name: extractors (no default features)
            flags: --no-default-features --features http1,json,form,query,cookies,matched-path,original-uri
          - name: transports + interop (ws, sse, tower, tls, acme, http/3)
            flags: --features ws,sse,tower,tower-log,tls,cert-gen,lets-encrypt,http3
          - name: full (no tor/i2p)
            flags: --features ws,sse,tower,tls,cert-gen,lets-encrypt,http3,compression-full,early-hints
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.name }}
      - name: clippy
        if: matrix.flags
        run: cargo clippy --locked -p tachyon-web --all-targets ${{ matrix.flags }}
      - name: test
        run: cargo test --locked -p tachyon-web ${{ matrix.flags }}

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - name: Install cmake (i2pd-sys builds its vendored C++ router)
        run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo doc --locked -p tachyon-web --all-features --no-deps
