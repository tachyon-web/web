name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: fmt / clippy / msrv / parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: rustfmt
        run: cargo fmt --all --check
      - name: cargo-audit
        run: cargo audit
      - name: clippy (default features)
        run: cargo clippy --locked -p tachyon-web --all-targets
      - uses: dtolnay/rust-toolchain@1.92
      - name: msrv (1.92)
        run: cargo +1.92 check --locked -p tachyon-web --features ws,tower-log,tls,cert-gen,lets-encrypt,http3

  build:
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
          - name: minimal (http1 only)
            flags: --no-default-features --features http1
          - name: http2 only (h2c, no HTTP/1.1 fallback)
            flags: --no-default-features --features http2
          - name: extractors (no default features)
            flags: --no-default-features --features http1,json,form,query,matched-path,original-uri
          - name: transports + interop (ws, tower-log, tls, acme, http/3)
            flags: --features ws,tower-log,tls,cert-gen,lets-encrypt,http3
          - name: full (no tor/i2p)
            flags: --features ws,tower-log,tls,cert-gen,lets-encrypt,http3
          - name: tls12-legacy (opt-in TLS 1.2 fallback)
            flags: --features ws,tower-log,tls,cert-gen,lets-encrypt,http3,tls12-legacy
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.name }}
      - name: clippy
        if: matrix.flags
        run: cargo clippy --locked -p tachyon-web --all-targets ${{ matrix.flags }}
      - name: test
        run: cargo test --locked -p tachyon-web ${{ matrix.flags }}

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - name: Install cmake (i2pd-sys builds its vendored C++ router)
        run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo doc --locked -p tachyon-web --features json,matched-path,original-uri,http1,http2,tower-log,ws,form,query,tracing,telemetry,tls,cert-gen,http3,lets-encrypt,tor,i2p --no-deps
      - name: doctests
        run: cargo test --locked -p tachyon-web --features json,matched-path,original-uri,http1,http2,tower-log,ws,form,query,tracing,telemetry,tls,cert-gen,http3,lets-encrypt,tor,i2p --doc

  cnsa:
    name: strict CNSA 2.0 profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install CMake (i2pd-sys builds its vendored C++ router)
        run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo clippy --locked -p tachyon-web --no-default-features --features http1,cnsa --all-targets
      - run: cargo test --locked -p tachyon-web --no-default-features --features http1,cnsa --lib
      # CNSA is only ever exercised above without an anonymity transport, and `transports`
      # only ever with `telemetry`. Both of those cfg combinations have broken the build
      # before while every other job stayed green, so they get their own check here.
      - run: cargo clippy --locked -p tachyon-web --no-default-features --features http1,http2,cnsa,tor,i2p --all-targets
      - run: cargo clippy --locked -p tachyon-web --all-targets --features tls,cert-gen,http3,tor,i2p
      # `tls` without `cert-gen`: the self-signed arms drop out and anything only they used
      # becomes dead. Never built before, and it was broken.
      - run: cargo check --locked -p tachyon-web --features tls,tor
      - run: cargo check --locked -p tachyon-web --features tls,i2p
