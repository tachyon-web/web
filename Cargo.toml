[package]
name = "tachyon-web"
version = "0.0.3"
edition = "2024"
rust-version = "1.92"
readme = "README.md"
authors = ["Hacer-Bark <hacer.bark@proton.me>"]
license = "0BSD"
description = "A fast, Axum-compatible async web framework with native TLS, HTTP/3, Tor (.onion), and I2P (.i2p) support"
repository = "https://github.com/tachyon-web/web"
documentation = "https://docs.rs/tachyon-web"
keywords = ["web", "framework", "server", "routing"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
# Async & Concurrency
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util", "fs"] }
pin-project-lite = "0.2"

# HTTP & Web
axum = { version = "0.8", default-features = false, features = ["tokio"] }
hyper = { version = "1", default-features = false, features = ["server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "server-auto"] }
http-body-util = "0.1"

# QUIC & HTTP/3
tachyon-quic = { version = "0.3", optional = true }

# TLS & Cryptography
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "prefer-post-quantum"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"], optional = true }
aws-lc-rs = { version = "1.17", optional = true }
instant-acme = { version = "0.8", default-features = false, features = ["aws-lc-rs"], optional = true }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "webpki-tokio"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

# Utilities & Performance
bytes = "1"
tracing = { version = "0.1", optional = true }
tower = { version = "0.5", default-features = false, features = ["util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }

# Optional native .onion hidden-service support (see the `tor` feature).
arti-client = { version = "0.46", default-features = false, features = ["tokio", "rustls", "onion-service-service", "onion-service-client", "vanguards", "static-sqlite"], optional = true }
tor-hsservice = { version = "0.46", default-features = false, optional = true }
tor-proto = { version = "0.46", default-features = false, features = ["hs-service"], optional = true }
tor-cell = { version = "0.46", default-features = false, optional = true }
tor-rtcompat = { version = "0.46", default-features = false, features = ["tokio"], optional = true }
tor-guardmgr = { version = "0.46", default-features = false, features = ["vanguards"], optional = true }
tor-config = { version = "0.46", default-features = false, optional = true }
safelog = { version = "0.9", default-features = false, optional = true }

# Optional native .i2p eepsite support.
tachyon-i2p = { version = "0.0.5", optional = true, default-features = false }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "cookies", "form"] }
tempfile = "3"
tokio-stream = "0.1"
tokio = { version = "1", features = ["test-util"] }
futures = "0.3"
hyper = { version = "1", features = ["client", "http2"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tower-http = { version = "0.7", default-features = false, features = ["fs"] }

[features]
default = [
    "json", "matched-path", "original-uri",
    "http1", "http2", "tower-log", "form", "query", "tokio", "tracing",
]

# Axum-parity features
http1 = ["axum/http1", "hyper/http1", "hyper-util/http1"]
http2 = ["axum/http2", "hyper/http2", "hyper-util/http2"]
json = ["axum/json", "dep:serde_json"]
matched-path = ["axum/matched-path"]
original-uri = ["axum/original-uri"]
tower-log = ["axum/tower-log", "tower/log"]
ws = ["axum/ws"]
form = ["axum/form"]
query = ["axum/query"]
multipart = ["axum/multipart"]
tokio = [] # no-op, kept for axum parity
tracing = ["axum/tracing"]
macros = ["axum/macros"]

# Tachyon-only additions
telemetry = ["dep:tracing"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:aws-lc-rs"]
tls12-legacy = ["tls", "rustls?/tls12", "tokio-rustls?/tls12", "hyper-rustls?/tls12"]
cert-gen = ["dep:rcgen", "dep:webpki", "tls"]
http3 = ["dep:tachyon-quic", "tls"]
fips = [
    "tls", "aws-lc-rs?/fips", "rustls?/fips", "instant-acme?/fips", "rcgen?/fips",
    "tachyon-i2p?/fips", "tachyon-quic?/fips",
]
cnsa = ["fips", "cert-gen", "rcgen/aws_lc_rs_unstable"]
lets-encrypt = [
    "dep:instant-acme", "dep:serde_json", "dep:hyper-rustls", "tls", "cert-gen",
    "hyper-util/client-legacy",
]
tor = [
    "dep:arti-client", "dep:tor-hsservice", "dep:tor-proto", "dep:tor-cell",
    "dep:futures-util", "dep:safelog", "dep:tor-rtcompat", "dep:tor-guardmgr", "dep:tor-config",
]
i2p = ["dep:tachyon-i2p", "tachyon-i2p/aws-lc"]

[lints.rust]
warnings = "deny"
future_incompatible = "deny"
unused = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
# The lint assumes an item's own module chain is the only path to it; it
# misses cases where a `pub use` elsewhere re-exports a `pub(crate)` item
# into a public module, which is exactly the pattern used to keep internal
# types out of the public API while flattening submodules away.
redundant_pub_crate = "allow"

[lints.rustdoc]
all = "deny"
broken_intra_doc_links = "deny"

[[example]]
name = "onion_i2p_server"
required-features = ["tor", "i2p"]

[[example]]
name = "hello_world"
required-features = ["json", "query"]

[[example]]
name = "hardened_server"
required-features = ["json"]

[[example]]
name = "self_signed_https"
required-features = ["cert-gen"]

[[example]]
name = "lets_encrypt"
required-features = ["lets-encrypt"]

[package.metadata.docs.rs]
# `cnsa` deliberately conflicts with `lets-encrypt`; public ACME CAs do not issue ML-DSA-87
# certificates. Build the ordinary complete API on docs.rs and document CNSA separately.
features = ["json", "matched-path", "original-uri", "http1", "http2", "tower-log", "ws", "form", "query", "tracing", "tls", "tls12-legacy", "cert-gen", "http3", "lets-encrypt", "tor", "i2p"]
